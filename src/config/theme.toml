# minimal
[colors]
background = "#ffffff"       # Pure clean white
surface = "#f8fafc"          # Subtle off-white surface
surface_hover = "#f1f5f9"    # Soft light gray hover state
foreground = "#0f172a"       # Deep slate black text
muted = "#64748b"           # Balanced gray for secondary text
accent = "#2563eb"          # Electric blue accent
accent_muted = "#2563eb15"   # Ultra-light blue tint for tags
border = "#e2e8f0"          # Light border lines
selection = "#2563eb"        # Accent highlight color

[fonts]
heading = "Inter, system-ui, -apple-system, sans-serif"
body = "Inter, system-ui, -apple-system, sans-serif"
heading_weight = "700"
body_weight = "400"
heading_letter_spacing = "normal"
body_letter_spacing = "normal"

[spacing]
section = "4rem"
container = "2rem"
gap = "1.5rem"

[layout]
max_width = "800px"

[style]
border_width = "1px"
border_radius = "8px"
radius_sm = "4px"
radius_md = "8px"
radius_lg = "16px"
panel_shadow = "0 1px 3px 0 rgba(0, 0, 0, 0.05)"

[motion]
duration = "200ms"
easing = "ease-out"