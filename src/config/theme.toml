[colors]
background = "#f4efe6"       # Warm vintage beige paper
surface = "#ebdccb"          # Sand/Khaki card background
surface_hover = "#e2cfb9"    # Darker khaki hover
foreground = "#2b261f"       # Deep warm espresso ink
muted = "#6e6252"           # Muted olive-tan text
accent = "#a34828"          # 90s Rust / Terracotta red
accent_muted = "#a3482820"   # Muted rust tint
border = "#2b261f"          # Dark crisp border outlines
selection = "#a34828"

[fonts]
heading = "'Courier New', Courier, monospace, sans-serif"
body = "system-ui, -apple-system, sans-serif"

[spacing]
section = "2.5rem"
container = "1.5rem"
gap = "1.25rem"

[layout]
max_width = "750px"

[style]
border_width = "2px"
border_radius = "4px"
panel_shadow = "4px 4px 0px #2b261f"